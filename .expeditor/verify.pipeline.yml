---
expeditor:
  cached_folders:
    - vendor
  defaults:
    buildkite:
      retry:
        automatic:
          limit: 1
      timeout_in_minutes: 30

steps:
- label: run-lint-and-specs-ruby-3.1
  command:
    - .expeditor/run_linux_tests.sh rake
  expeditor:
    executor:
      docker:
        # ruby:3.1-buster (Debian 10) ships glibc 2.28, which is too old for
        # precompiled native gems (e.g. nokogiri >= 1.15). Use bookworm instead.
        image: ruby:3.1-bookworm

- label: run-lint-and-specs-ruby-3.4
  command:
    - .expeditor/run_linux_tests.sh rake
  expeditor:
    executor:
      docker:
        image: ruby:3.4-bookworm

- label: run-specs-windows-ruby-3.1
  command:
    - bundle config --local path vendor/bundle
    - bundle config set --local without docs debug
    - bundle install --jobs=7 --retry=3
    - bundle exec rake
  expeditor:
    executor:
      docker:
        host_os: windows
        image: rubydistros/windows-2019:3.1

- label: run-specs-windows-ruby-3.4
  command:
    - bundle config --local path vendor/bundle
    - bundle config set --local without docs debug
    - bundle install --jobs=7 --retry=3
    - bundle exec rake
  expeditor:
    executor:
      docker:
        host_os: windows
        image: rubydistros/windows-2019:3.4
